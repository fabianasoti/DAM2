<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat con IA local</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<main>
  <header>
    <h1>Asistente del aula</h1>
    <p>Pregunta lo que quieras. La respuesta la calcula una IA que funciona en un ordenador de esta red: tus preguntas no salen a internet.</p>
  </header>

  <!-- Pantalla de entrada -->
  <section id="entrada" class="tarjeta">
    <label>Tu nombre <input id="nombre" maxlength="20" placeholder="Ana"></label>
    <label>Clave del aula <input id="clave" type="password" placeholder="Clave"></label>
    <button id="conectar">Entrar</button>
    <p id="aviso"></p>
  </section>

  <!-- Chat -->
  <section id="chat" class="tarjeta oculto">
    <div class="barra">
      <span id="punto" class="punto"></span>
      <span id="estado">Conectando...</span>
    </div>
    <div id="mensajes"></div>
    <form id="formulario">
      <input id="texto" maxlength="500" placeholder="Escribe tu pregunta" autocomplete="off">
      <button type="submit">Enviar</button>
    </form>
  </section>
</main>

<script src="js/chat.js"></script>
</body>
</html>
