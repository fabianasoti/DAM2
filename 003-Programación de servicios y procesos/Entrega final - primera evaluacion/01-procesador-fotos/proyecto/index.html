<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Procesador de fotos</title>
    <link rel="stylesheet" href="css/estilo.css">
  </head>

  <body>

    <header>
      <h1>Procesador de fotos</h1>
      <p>Elige varias fotos, escoge un filtro y aplícalo a todas.</p>
    </header>

    <main>

      <!-- Controles -->
      <section id="controles">

        <label class="boton" for="entrada">Elegir fotos</label>
        <input type="file" id="entrada" accept="image/*" multiple>

        <select id="filtro">
          <option value="grises">Escala de grises</option>
          <option value="sepia">Sepia</option>
          <option value="negativo">Negativo</option>
          <option value="brillo">Más brillo</option>
        </select>

        <label class="campo" for="repeticiones">Repeticiones por foto</label>
        <input type="number" id="repeticiones" value="1" min="1" max="1000">

        <label class="campo" for="numworkers">Workers</label>
        <select id="numworkers">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="4" selected>4</option>
          <option value="8">8</option>
        </select>
        <span class="campo" id="nucleos"></span>

        <button id="aplicar" disabled>Aplicar a todas</button>
        <button id="medir" disabled>Medir 1, 2, 4 y 8 workers</button>
        <button id="descargar" disabled>Descargar fotos</button>

      </section>

      <!-- Reloj de prueba: si la página se congela, el reloj se para -->
      <p id="reloj">Reloj de prueba: 0.0 s</p>

      <!-- Barra de progreso -->
      <div id="progreso">
        <div id="barra"><div id="relleno"></div></div>
        <p id="textoprogreso">0 de 0 fotos listas</p>
      </div>

      <!-- Galería: una tarjeta por foto -->
      <section id="galeria"></section>

      <!-- Mensaje de estado -->
      <p id="estado">Todavía no hay ninguna foto.</p>

      <!-- Tabla de mediciones -->
      <section id="resultados"></section>

    </main>

    <script src="js/filtros.js"></script>
    <script src="js/principal.js"></script>
  </body>
</html>
