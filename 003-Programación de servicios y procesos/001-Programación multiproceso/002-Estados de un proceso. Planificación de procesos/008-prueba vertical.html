<!doctype html>
<html>
  <head>
  </head>
  <body>
    <canvas id="lienzo" width=2048 height=2048></canvas>
    <script>
      const lienzo = document.querySelector("#lienzo")
      const contexto = lienzo.getContext("2d")
      
      let imagen = new Image();
      imagen.src = "keroppi.jpeg"
      
      let temporizador;
      let x = 0;
      let y = 0;
      let anchocacho = 64;
      
      imagen.onload = function(){
        contexto.drawImage(imagen, 0, 0, 2048, 2048)
        
        // Pasamos la referencia a la función bucle directamente
        temporizador = setTimeout(bucle, 1000)
      }
      
      function bucle(){
        procesaCacho(x, y)
        
        // Recorrido vertical: aumentamos 'y' primero
        y += anchocacho
        
        // Cuando llegamos al final del alto (2048), reiniciamos 'y' y pasamos a la siguiente columna 'x'
        if(y >= 2048){
          y = 0;
          x += anchocacho;
        }
        
        // Si aún no hemos procesado todo el ancho de la imagen, seguimos el bucle
        if(x < 2048){
          clearTimeout(temporizador)
          temporizador = setTimeout(bucle, 10) // Ajusta el tiempo (ms) para cambiar la velocidad del efecto
        }
      }
      
      function procesaCacho(x, y){
        let cacho = contexto.getImageData(x, y, anchocacho, anchocacho);
        let datos = cacho.data;
        for(let i = 0; i < datos.length; i += 4){
          datos[i] = 255 - datos[i]     // Invierto el canal rojo
          datos[i+1] = 255 - datos[i+1] // Invierto el canal verde
          datos[i+2] = 255 - datos[i+2] // Invierto el canal azul
        }
        contexto.putImageData(cacho, x, y)
      }
    </script>
  </body>
</html>
