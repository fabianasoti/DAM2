<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fabiana Sotillo | login</title>
  <link rel="shortcut icon" href="img/fs-favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="fs-login-pagina">
  <main class="fs-login">
    <article class="fs-login-marca">
      <img src="img/fs-logo-horizontal-blanco.svg" alt="Fabiana Sotillo">
      <h1>Interfaz integrada</h1>
      <p>Accede a tu espacio de trabajo.</p>
    </article>
    <article class="fs-login-tarjeta">
      <h2>Iniciar sesión</h2>
      <p>Introduce tus credenciales.</p>
      <form class="fs-form" action="index.html">
        <label class="fs-form-completo">
          <span>Email</span>
          <input type="email" required placeholder="nombre@ejemplo.com" autocomplete="username">
        </label>
        <label class="fs-form-completo">
          <span>Contraseña</span>
          <input type="password" required placeholder="••••••••" autocomplete="current-password">
        </label>
        <label class="fs-check fs-form-completo">
          <input type="checkbox">
          <span>Mantener la sesión iniciada</span>
        </label>
        <div class="fs-form-completo fs-login-acciones">
          <button class="fs-btn" type="submit">Entrar</button>
          <a class="fs-enlace" href="#">¿Olvidaste la contraseña?</a>
        </div>
      </form>
    </article>
  </main>
</body>
</html>
